name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 数据校验
        run: python3 scripts/validate.py

      - name: 课标映射严格模式（仅报告）
        continue-on-error: true
        env:
          STRICT_STANDARDS: "1"
        run: python3 scripts/validate.py

      - name: 题库答案核验
        run: python3 scripts/verify_questions.py --report /tmp/cn-math-taxonomy-verification-report.json

      - name: 题目示意图检查
        run: python3 scripts/check_figures.py

      - name: 初中道法安全测试
        run: python3 tests/test_jmor_safety.py

      - name: 初中英语待核分类
        run: python3 tests/test_enj_pending.py

      - name: 初中道法前端测试
        run: node tests/test_jmor_frontend.js

      - name: CI 工作流测试
        run: node tests/test_ci_workflow.js

      - name: 诊断引擎测试
        run: node tests/test_engine.js

      - name: 盲区汇总测试
        run: node tests/test_blindspots.js

      - name: 档案备份恢复测试
        run: node tests/test_children.js

      - name: 题目 ID 格式测试
        run: node tests/test_question_ids.js

      - name: 题干改写历史兼容测试
        run: node tests/test_stem_compat.js

      - name: 诊断报错链接
        run: node tests/test_report_link.js

      - name: 首页题库异步加载
        run: node tests/test_home.js

      - name: 页面脚本缓存测试
        run: node tests/test_pages_script_cache.js

      - name: 知识点间隔离（ask 不带跨知识点上下文）
        run: node tests/test_ask_graph_isolation.js
      - name: Node 测试：browser module wiring
        run: node tests/test_browser_module_wiring.js
      - name: Node 测试：chat chips
        run: node tests/test_chat_chips.js
      - name: Node 测试：chatgraph
        run: node tests/test_chatgraph.js
      - name: Node 测试：construct num
        run: node tests/test_construct_num.js
      - name: Node 测试：data split
