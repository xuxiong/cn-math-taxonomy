<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作业分析定位 · 学习路径</title>
<link rel="stylesheet" href="route.css">
</head>
<body>
<main id="root">
  <section class="card">
    <h1>作业分析文字 → 知识点定位 → 学习路径</h1>
    <p class="small muted">
      粘贴外部 app 对作业照片给出的分析文字。照片和 OCR 不在这里做。
      解析字段和候选池是纯确定性计算（不依赖网关）；第 ③ 步的 LLM 选择才需要网关。
    </p>
    <label for="in-text" class="small"><strong>分析文字</strong></label>
    <textarea id="in-text" placeholder="例如：这是一道初三数学题，考查用配方法解一元二次方程，学生算到一半卡住了。"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="btn-run" class="primary" type="button">定位</button>
      <button id="btn-clear" type="button">清空</button>
      <span id="status" class="small muted"></span>
    </div>
  </section>

  <!-- ① 解析出的字段 -->
  <section class="card" id="sec-fields" hidden>
    <h2><span class="num">1</span>解析出的字段</h2>
    <div id="fields-body"></div>
  </section>

  <!-- ② 候选池 -->
  <section class="card" id="sec-pool" hidden>
    <h2><span class="num">2</span>候选池</h2>
    <div id="pool-body"></div>
  </section>

  <!-- ③ LLM 的选择 -->
  <section class="card" id="sec-picks" hidden>
    <h2><span class="num">3</span>LLM 的选择</h2>
    <div id="picks-body"></div>
  </section>

  <!-- ④ 校验结果 -->
  <section class="card" id="sec-verify" hidden>
    <h2><span class="num">4</span>校验结果</h2>
    <div id="verify-body"></div>
  </section>

  <!-- ⑤ 前置链 -->
  <section class="card" id="sec-prereq" hidden>
    <h2><span class="num">5</span>前置链（只走 hard 边，回溯 2 层）</h2>
    <div id="prereq-body"></div>
  </section>

  <!-- ⑥ 接下来需要确认的知识点 / 你的薄弱点（诊断完成后换成真结论） -->
  <section class="card" id="sec-path" hidden>
    <h2><span class="num">6</span>接下来需要确认的知识点</h2>
    <div id="path-body"></div>
  </section>
</main>
<footer class="site-footer">
  <p>依赖图不是诊断结果：它只说「谁是谁的前置」，不说学生哪里断了。</p>
</footer>
<!-- engine.js 只读复用：重建图后调 replay + summarize，一行不改 -->
<script src="engine.js"></script>
<script src="route.js"></script>
<script src="route-page.js"></script>
</body>
</html>
