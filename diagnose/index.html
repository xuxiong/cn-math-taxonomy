<main id="root">
  <!-- 首屏骨架（阶段 0）：HTML 里直接就画出选题界面的架子，不等任何脚本/数据。
       结构与 app.js 的 renderStart 一致（标题 → 状态行 → 学段按钮 → 搜索框 → 说明行），
       所以数据到货后原地替换不跳版。样式在 diagnose/style.css 的 .skel / .skel-bar。 -->
  <div>
    <div class="card" id="skeleton-card">
      <h1>选择诊断目标</h1>
      <p class="muted" id="skeleton-status" role="status">正在载入知识库…</p>
      <div class="stage-tabs" role="tablist" aria-label="学段">
        <button type="button" class="stage-tab" role="tab" aria-selected="false" disabled>全部</button>
        <button type="button" class="stage-tab" role="tab" aria-selected="false" disabled>小学</button>
        <button type="button" class="stage-tab" role="tab" aria-selected="false" disabled>初中</button>
        <button type="button" class="stage-tab" role="tab" aria-selected="false" disabled>高中</button>
      </div>
      <input type="search" class="search-lg" id="search" placeholder="正在载入…" autocomplete="off" aria-label="搜索知识点" disabled>
      <p class="muted small" id="match-count"></p>
      <div class="skel" aria-hidden="true"><span class="skel-bar"></span><span class="skel-bar"></span><span class="skel-bar skel-short"></span></div>
      <p class="muted small">知识点清单按学科约十几 KB，弱网几秒；题目和说明在后台接着装，不影响你选。</p>
    </div>
  </div>
</main>

<!-- 首屏脚本链（预算 45KB 级）：只留「骨架 + 搜索 + 知识点列表 + 进入流程的入口」必需的三件。
       chapter.js      首屏纯函数层（parseChapter/subjectOf/buildGraph/gradeTargets + 题量常量）
       lazyload.js     必须在本文件之后、app.js 之前：app.js 的按需加载全靠 window.Lazy
       app.js          骨架 / 列表 / 题源门（按需段在 app-flow.js，见下）
     其余全部不在首屏链上，由 app.js 用 Lazy.load 按需注入：
       engine.js                     真正要出题 / 出图时才载（首屏列表不依赖它）
       app-flow.js                    出题 / 结果 / 分享 / 练习 / 路径图（engine.js 之后）
       ../assets/children.js / blindspots.js     孩子档案栏、薄弱点卡（首屏之后补）
       llm-config.js / explain.js / funclab.js / geomlab.js / labmatch.js / chatgraph.js
       variants.js / llm-eval.js / llm-gateway.js / llm-variants.js
       ../assets/vendor/{cytoscape,dagre,cytoscape-dagre}.min.js、qrcode.js / share.js
       ../assets/stats-config.js / stats.js / pwa.js   统计与安装提示 -->
<script src="chapter.js"></script>
<script src="lazyload.js"></script>
<script src="app.js"></script>
